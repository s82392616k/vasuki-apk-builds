<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>VASUKI DATA MANAGER</title>
  <style>
    :root{
      --bg:#0b1729;
      --panel: rgba(255,255,255,.06);
      --panel2: rgba(255,255,255,.08);
      --text:#eaf2ff;
      --muted: rgba(234,242,255,.75);
      --accent:#4aa3ff;
      --accent2:#27d07e;
      --warn:#ffb74a;
      --danger:#ff5f6d;
      --shadow: 0 14px 35px rgba(0,0,0,.35);
      --radius: 16px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(900px 380px at 50% -80px, rgba(74,163,255,.35), transparent 60%),
        radial-gradient(650px 300px at 10% 0%, rgba(39,208,126,.20), transparent 55%),
        linear-gradient(180deg, #071021 0%, #09172a 40%, #071021 100%);
      color:var(--text);
      min-height:100dvh;
      padding: 14px 14px 28px;
      display:flex;
      justify-content:center;
    }
    .app{
      width: 100%;
      max-width: 720px;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }
    .header{
      background: linear-gradient(180deg, rgba(74,163,255,.18), rgba(74,163,255,.05));
      border: 1px solid rgba(74,163,255,.25);
      border-radius: var(--radius);
      padding: 14px 14px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 10px;
      z-index: 2;
      backdrop-filter: blur(10px);
    }
    .title{
      margin:0;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing:.2px;
      font-weight: 800;
      color: rgba(200,235,255,.95);
      text-align:center;
    }
    .status{
      margin-top: 8px;
      font-size: 12.5px;
      text-align:center;
      color: rgba(140,255,195,.95);
      font-weight: 650;
      letter-spacing:.4px;
    }
    .panel{
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .scroll{
      max-height: calc(100dvh - 170px);
      overflow:auto;
      -webkit-overflow-scrolling: touch;
    }
    .body{
      padding: 12px 12px;
      display:flex;
      flex-direction:column;
      gap: 9px;
    }
    .label{
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.06);
      line-height:1.25;
      word-break: break-word;
    }
    .label.big{
      font-weight: 850;
      font-size: 17px;
      letter-spacing:.2px;
      background: rgba(74,163,255,.09);
      border-color: rgba(74,163,255,.18);
    }
    .label.mid{
      font-weight: 750;
      font-size: 15px;
      background: rgba(255,255,255,.05);
    }
    .label.small{
      font-size: 13.5px;
      color: var(--muted);
    }
    .label.accent{
      border-color: rgba(74,163,255,.28);
      background: rgba(74,163,255,.10);
    }
    .label.warn{
      border-color: rgba(255,183,74,.28);
      background: rgba(255,183,74,.10);
      color: rgba(255,235,200,.95);
    }
    .label.success{
      border-color: rgba(39,208,126,.28);
      background: rgba(39,208,126,.10);
      color: rgba(205,255,230,.98);
    }
    .btn{
      width:100%;
      border: none;
      border-radius: 14px;
      padding: 14px 14px;
      color: rgba(240,250,255,.96);
      font-size: 15px;
      font-weight: 800;
      letter-spacing:.2px;
      background: linear-gradient(180deg, rgba(74,163,255,.95), rgba(40,120,210,.95));
      box-shadow: 0 10px 24px rgba(0,0,0,.28);
      cursor:pointer;
      touch-action: manipulation;
    }
    .btn:active{ transform: translateY(1px); }
    .btn.secondary{
      background: linear-gradient(180deg, rgba(39,208,126,.95), rgba(25,150,90,.95));
    }
    .btn.ghost{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow:none;
      color: rgba(225,240,255,.95);
      font-weight: 800;
    }

    .hint{
      font-size: 12.5px;
      color: rgba(234,242,255,.68);
      padding: 0 12px 10px;
      text-align:center;
    }

    .row{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 0 2px;
    }
    .chip{
      flex: 1 1 160px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      padding: 10px 12px;
    }
    .chip .k{
      font-size: 12px;
      color: rgba(234,242,255,.70);
      font-weight: 750;
      letter-spacing:.3px;
    }
    .chip .v{
      margin-top: 6px;
      font-size: 16px;
      font-weight: 900;
    }

    .top-actions{
      display:flex;
      gap:10px;
      padding: 12px 12px 0;
    }
    .spacer{ flex:1; }
    .smallBtn{
      border:none;
      border-radius: 12px;
      padding: 10px 12px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      color: rgba(230,243,255,.95);
      font-weight: 800;
      cursor:pointer;
    }
    .smallBtn:active{ transform: translateY(1px); }
    .divider{
      height:1px;
      background: rgba(255,255,255,.08);
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1 class="title">VASUKI DATA MANAGER</h1>
      <div class="status">OFFLINE MODE | LOCAL DATABASE</div>
    </div>

    <div class="panel">
      <div class="top-actions">
        <button class="smallBtn" id="btnSeed">Seed Sample Verified Data</button>
        <div class="spacer"></div>
        <button class="smallBtn" id="btnClearDB" title="Clears local usage table">Reset Local DB</button>
      </div>
      <div class="hint">Works fully offline in your browser. Data is stored in your device (localStorage).</div>
      <div class="scroll">
        <div class="body" id="body"></div>
      </div>
    </div>
  </div>

  <script>
    /***********************
     * "SQLite-like" local DB (browser offline)
     ***********************/
    const DB_KEY = "vasuki_data_manager_usage_v1";

    function connectDB(){
      // In this web version, "connect" means load a JSON object.
      // Schema: { usage: { [day]: { mobile: number, wifi: number, verified: 0|1 } } }
      const raw = localStorage.getItem(DB_KEY);
      if(!raw){
        const state = { usage: {} };
        localStorage.setItem(DB_KEY, JSON.stringify(state));
        return state;
      }
      try{
        const parsed = JSON.parse(raw);
        if(!parsed || typeof parsed !== "object" || !parsed.usage) parsed.usage = {};
        localStorage.setItem(DB_KEY, JSON.stringify(parsed));
        return parsed;
      }catch(e){
        const state = { usage: {} };
        localStorage.setItem(DB_KEY, JSON.stringify(state));
        return state;
      }
    }
    function persistDB(state){
      localStorage.setItem(DB_KEY, JSON.stringify(state));
    }

    function get_usage(day){
      const state = connectDB();
      const row = state.usage[day];
      if(row) return [row.mobile ?? 0, row.wifi ?? 0, row.verified ? 1 : 0];
      return [0, 0, 0];
    }

    function save_usage(day, mobile, wifi){
      const state = connectDB();
      state.usage[day] = { mobile: Number(mobile) || 0, wifi: Number(wifi) || 0, verified: 1 };
      persistDB(state);
    }

    function bytesToMB(value){
      return Math.round((value / (1024 * 1024)) * 100) / 100;
    }

    /***********************
     * UI helpers
     ***********************/
    const body = document.getElementById('body');

    function clear(){
      body.innerHTML = "";
    }

    function label(text, opts={}){
      // opts: {size:'big'|'mid'|'small', colorClass, style}
      const div = document.createElement('div');
      div.className = "label";
      const size = opts.size || "small";
      div.classList.add(size);
      if(opts.colorClass) div.classList.add(opts.colorClass);
      if(opts.style){
        Object.assign(div.style, opts.style);
      }
      div.innerHTML = escapeMarkup(text);
      body.appendChild(div);
      return div;
    }

    function escapeMarkup(s){
      // supports minimal markup similar to [b]...[/b] and plain text/newlines
      // NOTE: keep safe: convert to text then replace tags we create ourselves
      const safe = String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
      // handle [b] [/b]
      return safe
        .replaceAll(/\[b\](.*?)\[\/b\]/g, "<strong>$1</strong>")
        .replaceAll(/\n/g, "<br/>");
    }

    function button(text, onClick, opts={}){
      const btn = document.createElement('button');
      btn.className = "btn";
      if(opts.variant === "secondary") btn.classList.add("secondary");
      if(opts.variant === "ghost") btn.classList.add("ghost");
      btn.textContent = text;
      btn.addEventListener('click', onClick);
      body.appendChild(btn);
      return btn;
    }

    function formatDay(d){
      // d is Date
      return d.toISOString().slice(0,10);
    }

    function todayDate(){
      return new Date();
    }

    /***********************
     * App screens (mirroring Python methods)
     ***********************/
    function dashboard(){
      clear();
      const today = formatDay(todayDate());
      const [mobile, wifi, verified] = get_usage(today);

      label("TODAY'S DATA USAGE", {size:"mid", colorClass:"accent", style:{fontSize:"17px"}});
      if(verified){
        const row = document.createElement('div');
        row.className = "row";
        const c1 = document.createElement('div'); c1.className="chip";
        c1.innerHTML = `<div class="k">Mobile</div><div class="v">${mobile} MB</div>`;
        const c2 = document.createElement('div'); c2.className="chip";
        c2.innerHTML = `<div class="k">Wi-Fi</div><div class="v">${wifi} MB</div>`;
        row.appendChild(c1); row.appendChild(c2);
        body.appendChild(row);
      }else{
        label("Mobile: Not connected", {size:"small", style:{color:"rgba(255,220,170,.95)", fontWeight:"800"}});
        label("Wi-Fi: Not connected", {size:"small", style:{color:"rgba(255,220,170,.95)", fontWeight:"800"}});
        label(
          "Real Android statistics are not available in this Browser-only version.",
          {size:"small", colorClass:"warn"}
        );
      }

      body.appendChild(document.createElement('div')).className = "divider";

      label("REPORTS", {size:"mid", style:{fontSize:"15.5px"}});

      button("Today's Report", today);
      button("Yesterday's Report", yesterday);
      button("Last 7 Days Report", week);
      button("Data Usage History", history);
      button("App Data Management", apps);
      button("Data Saving Solutions", solutions);
      button("Android Permission Guide", permissions);
      button("About", about);
    }

    function today(){
      clear();
      const day = formatDay(todayDate());
      const [mobile, wifi, verified] = get_usage(day);

      label("TODAY'S REPORT", {size:"mid", colorClass:"accent"});
      if(verified){
        label(`Mobile: ${mobile} MB`, {size:"small"});
        label(`Wi-Fi: ${wifi} MB`, {size:"small"});
        label(`Total: ${mobile + wifi} MB`, {size:"small", colorClass:"success"});
      }else{
        label("No verified statistics available.", {size:"small"});
        label("Today's actual usage is not connected.", {size:"small", colorClass:"warn"});
      }
      button("Back", dashboard, {variant:"ghost"});
    }

    function yesterday(){
      clear();
      const d = todayDate();
      d.setDate(d.getDate()-1);
      const day = formatDay(d);
      const [mobile, wifi, verified] = get_usage(day);

      label("YESTERDAY'S REPORT", {size:"mid", colorClass:"accent"});
      label(day, {size:"small", style:{fontWeight:"900", color:"rgba(234,242,255,.9)"}});
      if(verified){
        label(`Mobile: ${mobile} MB`, {size:"small"});
        label(`Wi-Fi: ${wifi} MB`, {size:"small"});
      }else{
        label("No saved verified report.", {size:"small", colorClass:"warn"});
      }
      button("Back", dashboard, {variant:"ghost"});
    }

    function week(){
      clear();
      label("7 DAY DATA REPORT", {size:"mid", colorClass:"accent"});
      let mobile_total = 0, wifi_total = 0;

      for(let i=0;i<7;i++){
        const d = todayDate();
        d.setDate(d.getDate()-i);
        const day = formatDay(d);
        const [mobile, wifi, verified] = get_usage(day);

        if(verified){
          mobile_total += mobile;
          wifi_total += wifi;
          label(`${day}\nMobile: ${mobile} MB | Wi-Fi: ${wifi} MB`, {size:"small"});
        }else{
          label(`${day}: No verified report`, {size:"small", colorClass:"warn"});
        }
      }

      label(`Mobile total: ${Math.round(mobile_total*100)/100} MB`, {size:"small", colorClass:"success"});
      label(`Wi-Fi total: ${Math.round(wifi_total*100)/100} MB`, {size:"small", colorClass:"success"});
      button("Back", dashboard, {variant:"ghost"});
    }

    function history(){
      clear();
      label("SAVED HISTORY", {size:"mid", colorClass:"accent"});

      const state = connectDB();
      const rows = Object.entries(state.usage)
        .filter(([day,row]) => (row.verified ? 1 : 0) === 1)
        .map(([day,row]) => [day, row.mobile ?? 0, row.wifi ?? 0])
        .sort((a,b)=> (a[0] < b[0] ? 1 : -1)) // desc by day (ISO string sorts lexicographically)
        .slice(0,30);

      if(!rows.length){
        label("No verified records saved.", {size:"small", colorClass:"warn"});
      }else{
        for(const row of rows){
          label(`${row[0]}\nMobile: ${row[1]} MB | Wi-Fi: ${row[2]} MB`, {size:"small"});
        }
      }
      button("Back", dashboard, {variant:"ghost"});
    }

    function apps(){
      clear();
      label("APP DATA MANAGEMENT", {size:"mid", colorClass:"accent"});
      label("Per-app network statistics require Android system integration.", {size:"small", colorClass:"warn"});
      label("To manage an app:");
      label("1. Open Android Settings.");
      label("2. Select Apps.");
      label("3. Choose an application.");
      label("4. Open Mobile data.");
      label("5. Review background data usage.");
      label("No invented app statistics are displayed.", {size:"small", colorClass:"success"});
      button("Back", dashboard, {variant:"ghost"});
    }

    function solutions(){
      clear();
      label("DATA SAVING SOLUTIONS", {size:"mid", colorClass:"accent"});
      const tips = [
        "1. Enable Android Data Saver.",
        "2. Restrict background data for unnecessary apps.",
        "3. Reduce streaming video quality.",
        "4. Disable automatic media downloads.",
        "5. Use Wi-Fi for large downloads.",
        "6. Turn off automatic updates on mobile data.",
        "7. Check hotspot usage."
      ];
      for(const t of tips) label(t, {size:"small"});
      button("Back", dashboard, {variant:"ghost"});
    }

    function permissions(){
      clear();
      label("ANDROID PERMISSION GUIDE", {size:"mid", colorClass:"accent"});
      label("Usage Access can be enabled in Android Settings.");
      label("Settings > Apps > Special app access > Usage data access");
      label("This permission alone does not provide per-app network byte counts.");
      label("Android NetworkStatsManager access requires a suitable Android integration.", {size:"small", colorClass:"warn"});
      button("Back", dashboard, {variant:"ghost"});
    }

    function about(){
      clear();
      label("VASUKI DATA MANAGER", {size:"mid", colorClass:"accent"});
      label("Version 2.1", {size:"small"});
      label("Developed by Vasuki", {size:"small"});
      label("Python + Kivy + SQLite (Web Offline Port)", {size:"small"});
      label("Offline-first application", {size:"small"});
      label("No online reports or advertisements.", {size:"small"});
      button("Back", dashboard, {variant:"ghost"});
    }

    /***********************
     * Demo controls (to mimic "verified" data)
     ***********************/
    document.getElementById('btnSeed').addEventListener('click', () => {
      // Create some sample verified values for today and previous 6 days
      // This mimics the Python app when verified stats exist.
      const baseMobile = 120 + Math.random()*500;
      const baseWifi = 50 + Math.random()*300;

      for(let i=0;i<7;i++){
        const d = todayDate();
        d.setDate(d.getDate()-i);
        const day = formatDay(d);
        const mobile = Math.round((baseMobile*(1-(i*0.06))) * 100)/100;
        const wifi = Math.round((baseWifi*(1-(i*0.04))) * 100)/100;

        // Make some days missing to replicate "No verified report"
        const shouldVerify = Math.random() > 0.15 || i===0;
        if(shouldVerify){
          save_usage(day, mobile, wifi);
        }else{
          // ensure it's not verified (leave absent)
          const state = connectDB();
          delete state.usage[day];
          persistDB(state);
        }
      }
      dashboard();
    });

    document.getElementById('btnClearDB').addEventListener('click', () => {
      const ok = confirm("Reset local database? This will remove all saved verified records.");
      if(!ok) return;
      localStorage.removeItem(DB_KEY);
      dashboard();
    });

    // Initial screen
    dashboard();
  </script>
</body>
</html>
