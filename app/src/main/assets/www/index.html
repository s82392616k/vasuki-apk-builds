<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta charset="UTF-8">
<title>spider web 🕸️#</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #121212;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
.header {
    background: #000;
    border-bottom: 3px solid #e23636;
    padding: 12px 15px;
    text-align: center;
    flex-shrink: 0;
  }
.header h1 { margin: 0; font-size: 22px; letter-spacing: 3px; color: #e23636; }
.header small { color: #888; font-size: 11px; letter-spacing: 1px; }
.urlbox { display: flex; padding: 10px; background: #1e1e1e; gap: 8px; flex-shrink: 0; }
  #url { flex: 1; padding: 12px; font-size: 15px; background: #2a2a2a; color: white; border: 2px solid #333; border-radius: 10px; outline: none; }
  #url:focus { border-color: #e23636; }
  #gobtn { padding: 12px 25px; font-size: 16px; font-weight: bold; background: #e23636; color: white; border: none; border-radius: 10px; cursor: pointer; }
  #gobtn:active { background: #b92b2b; }
  #content { flex: 1; overflow: auto; background: white; }
  #content iframe { width: 100%; height: 100%; border: none; }
  #info {
    background: #1a2a1a;
    color: #aaffaa;
    padding: 8px 12px;
    font-size: 12px;
    text-align: center;
    display: none;
  }
</style>
</head>
<body>

<div class="header">
  <h1>spider web 🕸️#</h1>
  <small>powered by vasuki H 91</small>
</div>

<div id="info"></div>

<div class="urlbox">
  <input type="text" id="url" placeholder="https://example.com or https://vasuki.indv" inputmode="url">
  <button id="gobtn" onclick="loadPage()">GO</button>
</div>

<div id="content">
  <iframe id="screen" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
</div>

<script>
  const urlInput = document.getElementById('url');
  const screen = document.getElementById('screen');
  const content = document.getElementById('content');
  const info = document.getElementById('info');

  // Local storage for your.indv sites
  let indvSites = JSON.parse(localStorage.getItem('indvSites') || '{}');

  window.onload = function() {
    // Check if URL has.indv hash on startup
    let hash = window.location.hash.replace('#', '');
    if (hash && hash.endsWith('.indv')) {
      loadIndvSite(hash);
    } else {
      loadNormalUrl('https://example.com');
    }
  }

  function loadPage() {
    let url = urlInput.value.trim();
    if (!url) return;

    // Handle.indv domains
    if (url.toLowerCase().endsWith('.indv')) {
      loadIndvSite(url.toLowerCase());
      return;
    }

    // Handle normal URLs
    if (!url.startsWith('http')) url = 'https://' + url;
    loadNormalUrl(url);
  }

  function loadIndvSite(fullUrl) {
    let domain = fullUrl.replace('https://', '').replace('http://', '').replace('.indv', '');

    // If we have stored data for this domain
    if (indvSites[domain]) {
      loadDataUrl(indvSites[domain], domain);
      return;
    }

    // First time - ask for data URL
    let dataUrl = prompt(`No file loaded for ${domain}.indv yet.\n\nPaste your data:text/html... URL here:`);
    
    if (dataUrl && dataUrl.startsWith('data:text/html')) {
      indvSites[domain] = dataUrl;
      localStorage.setItem('indvSites', JSON.stringify(indvSites));
      loadDataUrl(dataUrl, domain);
    } else {
      alert('Invalid data URL. Use vasuki_convert.html to generate it first.');
      loadNormalUrl('https://example.com');
    }
  }

  function loadDataUrl(dataUrl, domain) {
    // IMPORTANT: Load data URL in main window to avoid CSP block
    // But keep browser UI visible by using hash routing
    window.location.hash = `#${domain}.indv`;
    urlInput.value = `https://${domain}.indv`;
    showInfo(`Loaded https://${domain}.indv`);
    
    // Replace iframe with direct HTML content
    content.innerHTML = `<iframe id="screen" src="${dataUrl}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" style="width:100%;height:100%;border:none;"></iframe>`;
  }

  function loadNormalUrl(url) {
    window.location.hash = '';
    urlInput.value = url;
    hideInfo();
    content.innerHTML = `<iframe id="screen" src="${url}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" style="width:100%;height:100%;border:none;"></iframe>`;
  }

  function showInfo(msg) {
    info.textContent = msg;
    info.style.display = 'block';
    setTimeout(hideInfo, 3000);
  }

  function hideInfo() {
    info.style.display = 'none';
  }

  urlInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') loadPage();
  });
</script>

</body>
</html>
