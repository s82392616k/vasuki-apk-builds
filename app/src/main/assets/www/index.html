<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vasuki Search 3.0</title>
<style>
  body{font-family:sans-serif;margin:0;padding:0;background:#f1f1f1}
  .container{max-width:800px;margin:auto;padding:20px;background:#fff}
  h1{font-size:24px;text-align:center}
  select, input[type=text], button{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:4px}
  button{background:#007bff;color:#fff;border:none}
  button:hover{background:#0056b3}
  .output{background:#fafafa;padding:10px;margin-top:10px;border:1px solid #ddd}
  .item{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #eee}
  @media (max-width:600px){
    h1{font-size:20px}
  }
</style>
</head>
<body>
<div class="container">
  <h1>Vasuki Search 3.0</h1>
  <select id="mode">
    <option value="web">Google Web Search</option>
    <option value="images">Google Image Search</option>
    <option value="ai">AI Search Assistant</option>
  </select>
  <input type="text" id="query" placeholder="Enter your query here">
  <button id="run">Run</button>
  <div id="output" class="output"></div>
</div>

<script>
const API_KEY_SEARCH = 'YOUR_SEARCHAPI_KEY';
const API_KEY_AI = 'YOUR_POLLINATIONS_KEY';
const SEARCH_URL = 'https://www.searchapi.io/api/v1/search';
const AI_URL = 'https://gen.pollinations.ai/v1/chat/completions';

async function fetchJSON(url, opts={}) {
  try {
    const res = await fetch(url, opts);
    return await res.json();
  } catch(e){
    console.error(e);
    return null;
  }
}

function renderList(items, type='web'){
  const out = document.getElementById('output');
  out.innerHTML='';
  items.forEach((item,i)=>{
    const div = document.createElement('div');
    div.className='item';
    const title = document.createElement('h3');
    title.textContent = (i+1)+'. '+(item.title||'No title');
    div.appendChild(title);
    const link = document.createElement('a');
    link.href=item.link||item.original?.link||'#';
    link.target='_blank';
    link.rel='noopener';
    link.textContent = item.link||item.original?.link||'No URL';
    div.appendChild(link);
    const desc = document.createElement('p');
    desc.textContent = item.snippet||item.description||'';
    div.appendChild(desc);
    out.appendChild(div);
  });
}

async function googleSearch(query){
  const params = new URLSearchParams({
    engine:'google',
    q:query,
    api_key:API_KEY_SEARCH,
    gl:'in',
    hl:'en',
    safe:'active'
  });
  const data = await fetchJSON(SEARCH_URL+'?'+params);
  if(data && data.organic_results){
    renderList(data.organic_results);
  }else{
    document.getElementById('output').textContent='No results found.';
  }
}

async function imageSearch(query){
  const params = new URLSearchParams({
    engine:'google_images',
    q:query,
    api_key:API_KEY_SEARCH,
    gl:'in',
    hl:'en',
    safe:'active'
  });
  const data = await fetchJSON(SEARCH_URL+'?'+params);
  if(data && data.images){
    renderList(data.images, 'image');
  }else{
    document.getElementById('output').textContent='No images found.';
  }
}

async function aiSearch(query){
  const responseText = document.getElementById('output');
  responseText.textContent='AI processing…';
  const body = {
    model:'openai',
    messages:[
      {role:'system',content:'You are Vasuki Research AI. Explain information clearly. Use supplied webpage text as your source and do not invent facts.'},
      {role:'user',content:query}
    ],
    temperature:0.4
  };
  const data = await fetchJSON(AI_URL,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+API_KEY_AI
    },
    body:JSON.stringify(body)
  });
  if(data && data.choices && data.choices[0]){
    responseText.textContent=data.choices[0].message.content;
  }else{
    responseText.textContent='AI failed to respond.';
  }
}

document.getElementById('run').addEventListener('click', ()=>{
  const mode=document.getElementById('mode').value;
  const q=document.getElementById('query').value.trim();
  if(!q){alert('Please enter a query');return;}
  if(mode==='web')googleSearch(q);
  else if(mode==='images')imageSearch(q);
  else if(mode==='ai')aiSearch(q);
});
</script>
</body>
</html>
